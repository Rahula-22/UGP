services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shaadigen
      POSTGRES_PASSWORD: shaadigen
      POSTGRES_DB: shaadigen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaadigen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../shaadigen-backend
      dockerfile: Dockerfile
    env_file:
      - ../shaadigen-backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://shaadigen:shaadigen@postgres:5432/shaadigen
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../shaadigen-backend
      dockerfile: Dockerfile
    command: celery -A shaadigen.infrastructure.celery.app.celery_app worker --loglevel=info
    env_file:
      - ../shaadigen-backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://shaadigen:shaadigen@postgres:5432/shaadigen
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres-data:
